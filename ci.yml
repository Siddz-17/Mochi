name: ci

on:
  push:
  pull_request:

jobs:
  build:
    name: build / test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # NOTE: `npm install` (not `npm ci`) — package-lock.json is not synced
        # to GitHub (too large for the API push path), so CI regenerates it.
        run: npm install

      - name: Build sprites
        run: npm run build:sprites

      - name: Run mock provider tests
        run: node scripts/test-mock.cjs

      - name: Check dog refs
        run: node scripts/check-dog-refs.cjs

      - name: Smoke test (linux via xvfb)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run smoke

      - name: Smoke test (macos / windows)
        if: matrix.os != 'ubuntu-latest'
        run: npm run smoke
