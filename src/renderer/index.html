<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'"
  />
  <title>Mochi</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./settings.css" />
</head>
<body>
  <div id="stage">
    <canvas id="dog-canvas" width="128" height="128"></canvas>
    <div id="effects-layer"></div>
  </div>

  <div id="panel" class="hidden">
    <div id="panel-header">
      <h3>🐕 Mochi</h3>
      <div>
        <button type="button" id="chat-clear" aria-label="Clear chat" title="Clear chat">🗑</button>
        <button type="button" id="chat-close" aria-label="Close" title="Close">✕</button>
      </div>
    </div>
    <div id="messages"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" autocomplete="off" spellcheck="false" placeholder="Talk to Mochi…" />
      <button type="submit" id="chat-send" aria-label="Send">➤</button>
    </form>
    <div id="status-line"></div>
  </div>

  <div id="settings" class="hidden">
    <div id="settings-form"></div>
  </div>

  <script type="module" src="./boot.js"></script>
</body>
</html>
